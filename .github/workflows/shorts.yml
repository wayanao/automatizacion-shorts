name: Generar y publicar Short cada 6 horas

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generar-short:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffmpeg e ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core

      - name: Permitir a ImageMagick generar texto (policy de seguridad)
        run: |
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml || true
          sudo sed -i '/pattern="path"/d' /etc/ImageMagick-6/policy.xml || true

      - name: Copiar fuente para subtitulos
        run: |
          mkdir -p assets
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf assets/font.ttf

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Ejecutar pipeline de generacion del short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY_STATUS: "public"
        run: python -m src.main

      - name: Guardar historial de temas usados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_topics.json
          git diff --quiet --cached || git commit -m "chore: actualizar historial de temas"
          git push
